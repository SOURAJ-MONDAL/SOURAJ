<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3FAF8"/>
      <stop offset="55%" stop-color="#E8F5F1"/>
      <stop offset="100%" stop-color="#DDEFE9"/>
    </linearGradient>

    <radialGradient id="blobTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F5C5C" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0F5C5C" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blobAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8A33D" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#E8A33D" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dotGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#0F5C5C" opacity="0.08"/>
    </pattern>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- base wash -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  <rect width="1600" height="900" fill="url(#dotGrid)"/>

  <!-- soft ambient blobs -->
  <circle cx="1330" cy="140" r="360" fill="url(#blobTeal)" filter="url(#softBlur)"/>
  <circle cx="120" cy="760" r="320" fill="url(#blobAmber)" filter="url(#softBlur)"/>
  <circle cx="780" cy="900" r="260" fill="url(#blobTeal)" filter="url(#softBlur)"/>

  <!-- signature vitals pulse line sweeping the canvas -->
  <path d="M -50 560
           L 300 560
           L 350 560
           L 380 460
           L 420 660
           L 460 560
           L 520 560
           L 900 560
           L 940 460
           L 980 660
           L 1020 560
           L 1090 560
           L 1650 560"
        fill="none" stroke="#0F5C5C" stroke-width="2.5" stroke-linejoin="round"
        stroke-linecap="round" opacity="0.14"/>

  <path d="M -50 340
           L 480 340
           L 520 300
           L 560 380
           L 600 340
           L 1120 340
           L 1160 300
           L 1200 380
           L 1240 340
           L 1650 340"
        fill="none" stroke="#17807F" stroke-width="1.6" stroke-linejoin="round"
        stroke-linecap="round" opacity="0.10"/>

  <!-- kiosk / tablet silhouette watermark, lower right -->
  <g opacity="0.07" transform="translate(1180,470)">
    <rect x="0" y="0" width="300" height="380" rx="26" fill="none" stroke="#0F5C5C" stroke-width="6"/>
    <rect x="26" y="34" width="248" height="270" rx="10" fill="none" stroke="#0F5C5C" stroke-width="5"/>
    <circle cx="150" cy="345" r="10" fill="#0F5C5C"/>
    <!-- small pulse on the kiosk screen -->
    <path d="M46 180 L96 180 L114 140 L136 220 L154 180 L254 180"
          fill="none" stroke="#0F5C5C" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- faint medical cross accents scattered top-left area -->
  <g opacity="0.08" fill="#0F5C5C">
    <path d="M120 90 h18 v18 h18 v18 h-18 v18 h-18 v-18 h-18 v-18 h18 z"/>
  </g>
  <g opacity="0.06" fill="#E8A33D">
    <path d="M230 170 h14 v14 h14 v14 h-14 v14 h-14 v-14 h-14 v-14 h14 z"/>
  </g>
  <g opacity="0.07" fill="#0F5C5C">
    <path d="M60 230 h12 v12 h12 v12 h-12 v12 h-12 v-12 h-12 v-12 h12 z"/>
  </g>
</svg>
